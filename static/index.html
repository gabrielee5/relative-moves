<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relative Moves</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%274%27 fill=%27%23142030%27/%3E%3Cpath d=%27M3 11l3-3 2 2 5-5%27 fill=%27none%27 stroke=%27%23f2b33d%27 stroke-width=%271.8%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <link rel="preload" href="/static/vendor/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/vendor/uPlot-1.6.32.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="wordmark">Relative Moves</span>
      <span id="exchange" class="muted"></span>
    </div>
    <nav id="tabs" class="seg" aria-label="Views">
      <button type="button" data-view="ranking">Ranking</button>
      <button type="button" data-view="compare">Compare</button>
      <button type="button" data-view="strategies">Strategies <span id="strat-badge" class="badge" hidden></span></button>
    </nav>
    <span class="spacer"></span>
    <div id="status-wrap">
      <span id="live-dot" class="dot" aria-hidden="true"></span>
      <span id="status" class="muted"></span>
    </div>
    <button id="refresh" type="button" class="btn-icon">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12.5 1.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="refresh-label">Refresh</span>
    </button>
  </header>

  <!-- Feature 1: ranked table + OHLC snapshot -->
  <main id="view-ranking" class="view split">
    <section id="table-panel" class="panel">
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="filter" type="search" placeholder="Filter symbol" autocomplete="off" spellcheck="false" aria-label="Filter symbol">
        </label>
        <label class="field">Min vol
          <select id="minvol">
            <option value="0">any</option>
            <option value="1e5">$100K</option>
            <option value="1e6">$1M</option>
            <option value="1e7">$10M</option>
            <option value="1e8">$100M</option>
          </select>
        </label>
        <span class="spacer"></span>
        <span id="count" class="muted"></span>
      </div>
      <div id="table-scroll" class="scroll">
        <table id="rank-table">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <section id="chart-panel" class="panel">
      <div class="toolbar chart-head">
        <div id="chart-title" class="title"></div>
        <span class="spacer"></span>
        <span id="tf-buttons" class="seg"></span>
      </div>
      <div class="chart-wrap">
        <div id="chart" class="chart"></div>
        <div id="chart-empty" class="placeholder">Select an asset to see its chart</div>
      </div>
    </section>
  </main>

  <!-- Feature 2: rebased multi-asset comparison -->
  <main id="view-compare" class="view" hidden>
    <section class="panel">
      <div class="toolbar">
        <span id="lookback-buttons" class="seg"></span>
        <span class="seg" id="mode-buttons">
          <button type="button" data-mode="all">All assets</button>
          <button type="button" data-mode="selected">Highlighted only</button>
        </span>
        <form id="hl-form" autocomplete="off">
          <label class="search">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="hl-input" list="symbols" placeholder="Highlight symbol" spellcheck="false" aria-label="Highlight symbol">
          </label>
          <datalist id="symbols"></datalist>
        </form>
        <span id="hl-chips"></span>
        <span class="spacer"></span>
        <span id="cmp-note" class="muted"></span>
      </div>
      <div id="cmp-chart"><div id="cmp-empty" class="placeholder" hidden></div></div>
    </section>
  </main>

  <!-- Feature 3: strategy signals + chart with markers -->
  <main id="view-strategies" class="view split split-wide" hidden>
    <section id="sig-panel" class="panel">
      <div class="toolbar">
        <label class="field"><span class="sr-only">Strategy</span><select id="strat-filter"></select></label>
        <span class="spacer"></span>
        <span id="sig-count" class="muted"></span>
      </div>
      <p id="strat-desc" class="desc"></p>
      <div id="sig-scroll" class="scroll">
        <table id="sig-table">
          <thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Price</th><th>Stop</th><th>Target</th><th>Strategy</th><th>Note</th></tr></thead>
          <tbody id="sig-body"></tbody>
        </table>
        <div id="sig-empty" class="muted" hidden></div>
      </div>
    </section>

    <section id="strat-chart-panel" class="panel">
      <div class="toolbar chart-head">
        <div id="strat-title" class="title"></div>
        <span class="spacer"></span>
        <span id="strat-tf-buttons" class="seg"></span>
      </div>
      <div class="chart-wrap">
        <div id="strat-chart" class="chart"></div>
        <div id="strat-empty" class="placeholder">Select a signal to see its chart</div>
      </div>
    </section>
  </main>

  <script src="/static/vendor/lightweight-charts-5.2.1.js"></script>
  <script src="/static/vendor/uPlot-1.6.32.iife.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
